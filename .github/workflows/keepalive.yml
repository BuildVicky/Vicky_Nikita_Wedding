# Free Supabase projects pause after 7 idle days. This pings the database daily so the site stays awake.
# Needs repo secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions).
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/guest_wall"
          -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" -H "Content-Type: application/json" -d '{}'
